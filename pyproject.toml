[project]
name = "ff-jupyter-skill"
version = "0.1.0"
description = "Agent Skill for creating reliable, well-structured Jupyter notebooks with AI coding agents."
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "nbformat>=5",
    "nbconvert>=7",
]
execute = [
    "papermill>=2.4",
    "ipykernel>=6",
]
dev = [
    "ff-jupyter-skill[test,execute]",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
